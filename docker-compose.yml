services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoiceiq
      POSTGRES_PASSWORD: invoiceiq
      POSTGRES_DB: invoiceiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://invoiceiq:invoiceiq@db:5432/invoiceiq
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Production owns the schema via Alembic — apply migrations, then serve.
    # (docker-compose.prod.yml replaces this with the proxy-headers variant.)
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4}
    # Readiness (DB reachable) gates the container healthy, so `frontend` only
    # starts once the API can actually serve traffic.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "8000:8000"

  # Durable background worker: drains the job queue (recurring-invoice generation,
  # overdue reminders) and enqueues the daily periodic jobs. Shares the backend
  # image; runs the worker entrypoint instead of the web server. Scale with
  # `docker compose up --scale worker=N` — the claim is atomic, so it's safe.
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://invoiceiq:invoiceiq@db:5432/invoiceiq
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_healthy   # backend applies migrations first
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata:
