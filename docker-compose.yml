services:
  db:
    # Same PG16 base/data format; rebuild its privilege helper with patched Go.
    build: ./deploy/postgres
    image: bidit-postgres:local
    environment:
      POSTGRES_USER: invoiceiq
      POSTGRES_PASSWORD: invoiceiq
      POSTGRES_DB: invoiceiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development-only S3 candidate (ADR-0008, Decisions §29). Never attach the
  # historical MinIO data directory to RustFS or automatically migrate it.
  object-store-legacy-guard:
    build: ./backend
    command: [python, -m, app.storage_bootstrap, check-legacy]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - miniodata:/legacy-minio:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    healthcheck:
      disable: true

  # Retain the service/DNS name for existing application endpoint configuration.
  minio:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    command: [rustfs]
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: invoiceiq
      RUSTFS_SECRET_KEY: invoiceiq-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfsdata:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,uid=10001,gid=10001
      - /logs:rw,nosuid,nodev,size=16m,uid=10001,gid=10001
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    depends_on:
      object-store-legacy-guard:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot authenticated bucket initialization using the audited backend SDK.
  minio-init:
    build: ./backend
    command: [python, -m, app.storage_bootstrap, initialize]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_S3_BUCKET: invoiceiq-documents
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: invoiceiq
      AWS_SECRET_ACCESS_KEY: invoiceiq-secret
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    healthcheck:
      disable: true

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://invoiceiq:invoiceiq@db:5432/invoiceiq
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_KEY_FALLBACKS: ${JWT_SIGNING_KEY_FALLBACKS:-[]}
      # OPS-006 (audit 2026-09-05): this is the DEV stack. It used to hard-code
      # `production`, which turns on the boot-time safety net that refuses to
      # start without INBOUND_EMAIL_SECRET — so `make up` crash-looped. The
      # production overlays (docker-compose.prod.yml / .hostinger.yml) set
      # production explicitly; here it is an opt-in override.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      # Match NGINX's existing 20 MiB envelope; capture policy packs browser batches.
      UPLOAD_MAX_BODY_MB: ${UPLOAD_MAX_BODY_MB:-20}
      UPLOAD_MAX_ACTIVE_REQUESTS: ${UPLOAD_MAX_ACTIVE_REQUESTS:-2}
      UPLOAD_BODY_IDLE_SECONDS: ${UPLOAD_BODY_IDLE_SECONDS:-30}
      UPLOAD_BODY_TIMEOUT_SECONDS: ${UPLOAD_BODY_TIMEOUT_SECONDS:-300}
      # Document bytes → development RustFS (S3). boto3 reads AWS_* credentials.
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: invoiceiq-documents
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: invoiceiq
      AWS_SECRET_ACCESS_KEY: invoiceiq-secret
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Production owns the schema via Alembic — apply migrations, then serve.
    # (docker-compose.prod.yml replaces this with the proxy-headers variant.)
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4}
    # Readiness (DB reachable) gates the container healthy, so `frontend` only
    # starts once the API can actually serve traffic.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "8000:8000"

  # Durable background worker: drains the job queue (recurring-invoice generation,
  # overdue reminders) and enqueues the daily periodic jobs. Shares the backend
  # image; runs the worker entrypoint instead of the web server. Scale with
  # `docker compose up --scale worker=N` — the claim is atomic, so it's safe.
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://invoiceiq:invoiceiq@db:5432/invoiceiq
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_KEY_FALLBACKS: ${JWT_SIGNING_KEY_FALLBACKS:-[]}
      # OPS-006 (audit 2026-09-05): this is the DEV stack. It used to hard-code
      # `production`, which turns on the boot-time safety net that refuses to
      # start without INBOUND_EMAIL_SECRET — so `make up` crash-looped. The
      # production overlays (docker-compose.prod.yml / .hostinger.yml) set
      # production explicitly; here it is an opt-in override.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: invoiceiq-documents
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: invoiceiq
      AWS_SECRET_ACCESS_KEY: invoiceiq-secret
    depends_on:
      backend:
        condition: service_healthy   # backend applies migrations first
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    # Liveness of THIS process's loop: the worker touches a heartbeat file every
    # tick (and every lease heartbeat inside a long job); the probe fails when
    # it goes stale. Replaces the image's inherited HTTP healthcheck, which
    # probes a port the worker never serves. On compose this makes the state
    # visible (`docker compose ps`); Docker does not restart an unhealthy
    # container by itself — Kubernetes' livenessProbe does (deploy/k8s).
    # A queue backlog is NOT a liveness failure — /health/queue pages on that.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_probe"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata:
  miniodata:
  rustfsdata:
