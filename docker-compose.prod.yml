# Production overrides — TLS at the nginx origin, behind Cloudflare.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required env (e.g. in a .env file next to this):
#   SECRET_KEY            strong random string  (openssl rand -hex 32)
#   APP_ORIGIN            https://app.example.com   (your public URL)
#   TLS_CERT_DIR          host dir holding origin.pem + origin.key (Cloudflare Origin cert)
#   INBOUND_EMAIL_SECRET  shared secret for the /email/inbound webhook — REQUIRED
#                         (production refuses to boot without it; generate with
#                         python -c "import secrets;print(secrets.token_urlsafe(32))")
#
# See docs/DEPLOY-TLS.md for the full Cloudflare + SSL walkthrough.
services:
  # OPS-005 (audit 2026-09-05): the base file publishes Postgres on :5432 and
  # MinIO on :9000/:9001 to the HOST with the dev credentials baked in. This
  # overlay used to leave both untouched, so following docs/DEPLOYMENT.md
  # produced an internet-reachable database holding every tenant's invoices.
  # Every credential below is REQUIRED (`:?`) and no state service is published.
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # `!reset` is load-bearing: compose MERGES port lists across files, so a bare
    # `ports: []` in an overlay is a no-op (verified with `docker compose config`
    # — the base file's 5432 stayed published, and so did the backend's 8000
    # under the `ports: []` this file carried before). `!reset` replaces the list.
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceiq"]

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports: !reset []

  minio-init:
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?} ${MINIO_ROOT_PASSWORD:?} &&
      mc mb --ignore-existing local/invoiceiq-documents &&
      echo 'bucket ready'"

  backend:
    environment:
      ENVIRONMENT: production
      HSTS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://invoiceiq:${POSTGRES_PASSWORD:?}@db:5432/invoiceiq
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
      CORS_ORIGINS: ${APP_ORIGIN:?set APP_ORIGIN, e.g. https://app.example.com}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:?set INBOUND_EMAIL_SECRET (python -c "import secrets;print(secrets.token_urlsafe(32))")}
      # SEC-002: the nginx origin is the ONE trusted hop. The app takes the client
      # address that many hops from the right of X-Forwarded-For (never the
      # leftmost, client-supplied value) for BOTH the auth rate limit and the
      # audit trail's ip column. uvicorn's own --proxy-headers is deliberately
      # not used — see backend/Dockerfile.
      TRUSTED_PROXY_COUNT: "1"
    # Apply DB migrations, then start uvicorn. X-Forwarded-Proto/For from the
    # nginx origin are read by the app itself (TRUSTED_PROXY_COUNT above).
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    # Not published to the host — only nginx reaches it on the compose network.
    ports: !reset []

  # OPS-006: the production-config safety net validates in EVERY process. The
  # worker inherits the base file's environment; without these it crash-loops
  # while the backend runs fine — the exact 2026-08-23 incident, which had been
  # fixed in docker-compose.hostinger.yml and not here.
  worker:
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://invoiceiq:${POSTGRES_PASSWORD:?}@db:5432/invoiceiq
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:?set INBOUND_EMAIL_SECRET}

  frontend:
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR with origin.pem + origin.key}:/etc/nginx/certs:ro
    # `!override` REPLACES the base file's list (which carries the 8080:80 dev
    # port); `!reset` would empty it regardless of the values written here.
    ports: !override
      - "80:80"
      - "443:443"
