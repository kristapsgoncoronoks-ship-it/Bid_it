# Single-node production stack for ONE Linux VPS (e.g. a Hostinger KVM VPS).
#
# Self-contained: Postgres + backend (API) + worker + frontend (nginx TLS origin)
# on one box. Document bytes are stored on a LOCAL persisted volume — at
# single-node scale there is no need to run a separate object store (MinIO/S3),
# so this stack drops it. The backend and worker SHARE that volume so the worker
# can read back what an upload stored.
#
# Usage (see docs/DEPLOY-HOSTINGER.md for the full walkthrough):
#   cp .env.hostinger.example .env      # fill in the required values
#   mkdir -p certs                      # drop origin.pem + origin.key here (TLS)
#   docker compose --env-file .env -f docker-compose.hostinger.yml up -d --build
#
# The backend runs `alembic upgrade head` before serving. nginx terminates TLS
# and reverse-proxies /api to the backend on the private compose network.
name: invoiceiq

# OPS-008 (audit 2026-09-05): logs went to the default json-file driver with no
# cap — unbounded growth on a 4 GB box, and gone on `docker compose down`.
# Every service applies this anchor: 10 MB × 5 files, rotated by Docker.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Optional personal-calendar connections and explicit email delivery. The API
# and every queue consumer must resolve the same providers and public callbacks.
# Empty client/SMTP values keep their delivery channels unconfigured.
x-schedule-delivery-environment: &schedule-delivery-environment
  API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-${APP_ORIGIN:?set APP_ORIGIN in .env}}
  CALENDAR_PUBLIC_APP_URL: ${CALENDAR_PUBLIC_APP_URL:-${APP_ORIGIN:?set APP_ORIGIN in .env}}
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
  OUTLOOK_CALENDAR_CLIENT_ID: ${OUTLOOK_CALENDAR_CLIENT_ID:-}
  OUTLOOK_CALENDAR_CLIENT_SECRET: ${OUTLOOK_CALENDAR_CLIENT_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_FROM: ${SMTP_FROM:-billing@invoiceiq.app}

services:
  db:
    # Same PG16 base/data format; the images overlay supplies the CI-built artifact.
    build: ./deploy/postgres
    image: bidit-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoiceiq}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Deliberately NOT published to the host — only the app reaches Postgres on
    # the private compose network.

  backend:
    build: ./backend
    environment:
      <<: *schedule-delivery-environment
      ENVIRONMENT: production
      HSTS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY in .env (openssl rand -hex 32)}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_KEY_FALLBACKS: ${JWT_SIGNING_KEY_FALLBACKS:-[]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-invoiceiq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-invoiceiq}
      CORS_ORIGINS: ${APP_ORIGIN:?set APP_ORIGIN in .env, e.g. https://app.example.com}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      UPLOAD_MAX_BODY_MB: ${UPLOAD_MAX_BODY_MB:-20}
      UPLOAD_MAX_ACTIVE_REQUESTS: ${UPLOAD_MAX_ACTIVE_REQUESTS:-2}
      UPLOAD_BODY_IDLE_SECONDS: ${UPLOAD_BODY_IDLE_SECONDS:-30}
      UPLOAD_BODY_TIMEOUT_SECONDS: ${UPLOAD_BODY_TIMEOUT_SECONDS:-300}
      # Document bytes on a local persisted volume (no object store at single-node).
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/var/storage
      # ARCH-002: `local` in production is by design HERE — one box, one
      # volume shared by backend and worker (below). The acknowledgement
      # silences the startup warning that protects a multi-replica deployment
      # from N disjoint document stores.
      STORAGE_LOCAL_SHARED: "true"
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:?set INBOUND_EMAIL_SECRET in .env (python -c "import secrets;print(secrets.token_urlsafe(32))")}
      # SEC-002: the nginx `frontend` container is the ONE trusted hop. The app
      # takes the client address that many hops from the right of
      # X-Forwarded-For (never the leftmost, client-supplied value) for BOTH the
      # auth rate limit and the audit trail's ip column. uvicorn's own
      # --proxy-headers is deliberately not used — see backend/Dockerfile.
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      - storagedata:/app/var/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published — nginx reaches it as http://backend:8000 on the compose network.

  worker: &worker-service
    build: ./backend
    # Match Compose's existing project-worker tag and reuse it in the optional
    # light lane. No separate calendar runtime or model image is required.
    image: ${COMPOSE_PROJECT_NAME:-invoiceiq}-worker
    environment:
      <<: *schedule-delivery-environment
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_KEY_FALLBACKS: ${JWT_SIGNING_KEY_FALLBACKS:-[]}
      # The production-config safety net validates in EVERY process, worker
      # included — omitting this crash-looped the worker on the real VPS
      # (2026-08-23) while the backend ran fine.
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:?set INBOUND_EMAIL_SECRET in .env (python -c "import secrets;print(secrets.token_urlsafe(32))")}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-invoiceiq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-invoiceiq}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/var/storage
      # ARCH-002: `local` in production is by design HERE — one box, one
      # volume shared by backend and worker (below). The acknowledgement
      # silences the startup warning that protects a multi-replica deployment
      # from N disjoint document stores.
      STORAGE_LOCAL_SHARED: "true"
    volumes:
      # SAME volume as the backend — the worker reads back the bytes the upload
      # route stored (and writes capture artifacts). Do not remove.
      - storagedata:/app/var/storage
    depends_on:
      backend:
        condition: service_healthy   # backend applies migrations first
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.worker"]
    # The worker shares the backend image, whose HEALTHCHECK probes an HTTP port
    # the worker doesn't serve — so it would show a misleading "unhealthy".
    # Replaced by the worker's own liveness probe: the loop touches a heartbeat
    # file every tick (and every lease heartbeat inside a long job) and the
    # probe fails when it goes stale — a wedged loop shows as `unhealthy` in
    # `docker compose ps` (Docker surfaces it; it does not restart on it —
    # `restart: unless-stopped` covers a crash, this covers a hang you can see).
    # A queue backlog is NOT a liveness failure — /health/queue pages on that.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_probe"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional lightweight consumer so a long OCR job in the general worker does
  # not occupy the only queue process for calendar/email work. The ordinary
  # worker still handles all kinds; atomic durable claims arbitrate both.
  # Opt in with COMPOSE_PROFILES=calendar in .env (see the environment example).
  calendar-worker:
    <<: *worker-service
    profiles: [calendar]
    command:
      - python
      - -m
      - app.worker
      - --kinds
      - calendar.sync,schedule.email,assignment.reminder,assignment.client_notice

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""        # same-origin: the SPA calls /api on this host
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # The image's baked-in healthcheck probes HTTP on IPv4 loopback — the prod
    # nginx 301s that to HTTPS, so the container reported "unhealthy" while
    # serving perfectly. Probe over TLS (self-signed-tolerant) instead.
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:        # Postgres data — back this up (see the deploy doc).
  storagedata:   # document bytes (uploaded originals, receipts, logos) — back this up.
