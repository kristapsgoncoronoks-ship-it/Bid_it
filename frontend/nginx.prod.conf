# Production origin: terminates TLS (Cloudflare Origin Certificate, SSL mode
# "Full (Strict)"), serves the SPA, proxies /api to the backend. Cloudflare sits
# in front; this is the origin server. Mount your cert/key at /etc/nginx/certs.

# --- Restore the real visitor IP from Cloudflare -------------------------------
# Cloudflare proxies every request, so $remote_addr would be a Cloudflare edge IP.
# Trust the CF ranges and read the true client IP from CF-Connecting-IP, so the
# app (logs, X-Forwarded-For, any rate-limiting) sees the actual visitor.
# Keep these ranges current: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- HTTP :80 → redirect to HTTPS ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS origin -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Cloudflare Origin Certificate (Full Strict). Swap for a Let's Encrypt cert
    # if you terminate TLS yourself — see docs/DEPLOY-TLS.md.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Optional but recommended: Cloudflare Authenticated Origin Pulls — reject
    # any request that did NOT come through your Cloudflare zone.
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense-in-depth; the API adds its own too).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Compress text responses at the origin. Cloudflare also compresses at the
    # edge, but this covers direct-origin hits and cuts origin→edge egress. Static
    # JS/CSS and API JSON are the payloads that benefit; binaries are skipped.
    gzip on;
    gzip_vary on;              # emit Vary: Accept-Encoding so caches stay correct
    gzip_comp_level 5;         # good ratio without burning CPU on every response
    gzip_min_length 1024;      # don't bother compressing tiny payloads
    gzip_proxied any;          # compress proxied API responses too
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        image/svg+xml;

    # Allow invoice / bank-statement uploads (the app caps at 15 MB).
    client_max_body_size 20m;

    # SPA: client-side routing falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # tell the app it's HTTPS
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Readiness (DB reachable) — proxied so external uptime monitors can hit the
    # real check instead of falling through to the SPA index.html.
    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
