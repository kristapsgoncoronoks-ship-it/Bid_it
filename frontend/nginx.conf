server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path falls back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow invoice / bank-statement uploads (the app caps at 15 MB); nginx
    # defaults to 1 MB, which would 413 a scanned PDF before it reaches the app.
    client_max_body_size 20m;

    # Proxy API calls to the backend service (compose network name: backend).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
