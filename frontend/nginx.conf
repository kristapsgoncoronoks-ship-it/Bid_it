# Shared across this origin's NGINX workers; empty keys do not consume slots.
# Match route paths rather than client-supplied Content-Type.
map "$request_method:$uri" $upload_admission_key {
    default "";
    ~^POST:/api/[^/]+/invoices/upload(?:/batch)?/?$ uploads;
    ~^POST:/api/[^/]+/invoices/[^/]+/attachments/?$ uploads;
    ~^POST:/api/[^/]+/masters/projects/[^/]+/documents/?$ uploads;
    ~^POST:/api/[^/]+/issuer/logo/?$ uploads;
    ~^POST:/api/[^/]+/issued/[^/]+/attachments/?$ uploads;
    ~^POST:/api/[^/]+/reconciliation/import/?$ uploads;
    ~^POST:/api/[^/]+/expenses/(?:import/bank-statement|receipt-scan)/?$ uploads;
    ~^POST:/api/[^/]+/expenses/[^/]+/items/[^/]+/receipt/?$ uploads;
    ~^POST:/api/[^/]+/transport/customers/[^/]+/documents/?$ uploads;
    ~^POST:/api/[^/]+/transport/(?:statements|estimate)/?$ uploads;
    ~^POST:/api/[^/]+/email/inbound(?:/mailgun)?/?$ uploads;
}
limit_conn_zone $upload_admission_key zone=upload_admission:64k;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path falls back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow invoice / bank-statement uploads (the app caps at 15 MB); nginx
    # defaults to 1 MB, which would 413 a scanned PDF before it reaches the app.
    client_max_body_size 20m;

    # Proxy API calls to the backend service (compose network name: backend).
    location /api/ {
        # Shared origin admission precedes body reads; API slots remain per worker.
        limit_conn upload_admission 2;
        limit_conn_status 503;
        # Preserve NGINX's existing 60s fallback; API idle deadline defaults to 30s.
        client_body_timeout 60s;
        error_page 503 = @upload_busy;
        # Stream chunked bodies too: HTTP/1.0 would force NGINX buffering.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @upload_busy {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 1 always;
        return 503 '{"detail":"Upload capacity is busy. Wait for current uploads to finish, then retry.","code":"upload_busy"}';
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
