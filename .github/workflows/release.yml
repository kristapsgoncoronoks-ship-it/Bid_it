name: Release

# Build + push production images to GHCR:
#   - on a semver tag (e.g. v1.2.0): `1.2.0`, `1.2`, `sha-<short>`;
#   - on every push to main (OPS-003, audit 2026-09-05): `main` and
#     `sha-<7>` — so every commit the CI auto-deploy lands has an IMMUTABLE
#     image a rollback can pull, instead of a rebuild from the previous commit
#     on the VPS (which `docker image prune -f` on the host used to make the
#     only option). Consuming them on the VPS is an opt-in overlay
#     (docker-compose.images.yml) the owner switches to — docs/DEPLOY-HOSTINGER.md.
# These tags are a BUILD, not a promotion: they exist before CI's verdict on the
# same commit (this workflow has no dependency on ci.yml), so `main` may name a
# commit CI rejected. Deploy by `sha-<7>` of the commit the deploy job shipped.
# Deployment itself stays a separate, deliberate step (see docs/DEPLOYMENT.md) —
# this workflow only produces tagged artifacts. ci.yml's `docker-build` job
# builds the same images without pushing (the Dockerfile regression check);
# both share the GitHub Actions layer cache — keep them separate, the CI token
# stays read-only (SEC-SC-001).
on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
  workflow_dispatch:

# Two quick pushes to main must not race for the moving `main` tag (the older
# commit's build could finish last and win). Serialise, never cancel — a
# cancelled run would lose an intermediate commit's `sha-<7>` image, which is
# the rollback artifact OPS-003 exists for.
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
