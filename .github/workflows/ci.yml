name: CI

on:
  # Push CI runs only on main (post-merge) + manual dispatch; branch work is
  # covered by the pull_request run, so a PR'd branch is no longer built twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_vr_baselines:
        description: >-
          Regenerate the visual-regression baselines inside the CI container,
          upload them as an artifact and commit them to the DISPATCHING branch
          (never main): a workflow that rewrote the baselines on the default
          branch would bless whatever regression prompted the refresh. Look at
          the images, then merge the branch deliberately.
        type: boolean
        default: false

# SEC-SC-001 (PSC/Flask cycles, reference integration R3): the token every job
# receives is read-only by default. Exactly one job writes to the repository —
# `vr-baselines`, which publishes refreshed visual baselines to the branch it
# was dispatched from (never main) and re-grants `contents: write` for itself;
# the deploy job uses its own SSH secret, never GITHUB_TOKEN.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fleet Fuel PII quarantine gate (WO-6, risk L-3) — REQUIRED CHECK. Fast and
  # dependency-free (stdlib only, no pip install): scans the working tree for
  # deny-listed Fleet Fuel identifiers (salted-hash compare — the salt is the
  # PII_SCAN_SALT secret, never committed) plus structural EU-VAT-id / MOD-97
  # IBAN patterns. Fails closed on a missing deny-list; a false positive is
  # resolved by an allow-list entry with a named verifier — NEVER by disabling
  # this job. Nightly full-history pass: .github/workflows/pii-history.yml.
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: PII scan (working tree)
        env:
          PII_SCAN_SALT: ${{ secrets.PII_SCAN_SALT }}
        run: python scripts/pii_scan.py --tree

  # Fast static gate — runs first, no services, fails in seconds on a style/type
  # regression before the slower test/docker jobs spend a runner.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generated-contract diagnostic diff
        run: python scripts/r010_ci_diagnostics.py
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format diagnostic diff
        run: ruff format --diff app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy (whole app — type-clean, enforced)
        run: mypy app
      # SEC-SC-001 / SEC-CTRL-001 (reference integration R3): every external
      # action pinned to a commit SHA, and the security-control register in
      # sync with its generated view. Stdlib only; also run by
      # security-supply-chain.yml on pull requests.
      - name: GitHub Actions pinned to commit SHAs
        run: python ../scripts/check_github_action_pins.py
      - name: Security-control register consistent with its generated view
        run: python ../scripts/security_control_gate.py --check
      # SEC-011 (audit 2026-09-05): dependency CVEs were never assessed. This
      # fails the build on a known vulnerability in a pinned package. Ignored
      # advisories carry their reason here — never silence one without it.
      - name: pip-audit (known CVEs in pinned dependencies)
        run: |
          pip install -q pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Playwright lock and both job containers agree (fast feedback)
        run: python ../scripts/check_playwright_pair.py
      - name: Supply-chain regression contracts (fast feedback)
        run: python -m pytest tests/test_supply_chain_gates.py tests/test_playwright_pair_gate.py -q
      - name: Migrations are consistent (single head, apply cleanly, no drift)
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic check
      - name: Expense command regression contracts (R010)
        run: python -m pytest tests/test_r010_expense_commands.py -q
      - run: python -m pytest -q

  # Postgres-specific gate: migrations + RLS can only be verified against a real
  # Postgres (the main suite runs on SQLite). Catches Postgres-only migration
  # bugs and proves row-level security blocks cross-tenant at the DB layer.
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create a NON-superuser app role + database (RLS must apply to it)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE appuser LOGIN PASSWORD 'apppw' NOSUPERUSER;"
          psql -h localhost -U postgres -c "CREATE DATABASE invoiceiq OWNER appuser;"
      - name: Migrations apply cleanly on Postgres (catches Postgres-only bugs)
        env:
          DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: alembic upgrade head
      # QA-001 (audit 2026-09-05): EVERY file that self-selects on
      # RLS_TEST_DATABASE_URL must be named here — eight of these tests (the
      # double-payment, double-credit and pooled-connection RLS guards) existed
      # for weeks and ran in NO job because this list was kept by hand.
      # tests/test_qa001_pg_tests_run_in_ci.py now fails the build when a
      # pg-only file is missing from this step.
      - name: Postgres-only tests (RLS enforcement + every concurrency guard)
        env:
          RLS_TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: >-
          python -m pytest -q
          tests/test_rls.py
          tests/test_rls_connection_reuse.py
          tests/test_tenant_guard_mechanism.py
          tests/test_perf_harness_seed.py
          tests/test_numbering_concurrency.py
          tests/test_r011_pg_concurrency.py
          tests/test_r012_pg_concurrency.py
          tests/test_r010_expense_commands_pg.py
          tests/test_session_org_isolation_pg.py
          tests/test_ecc_security_pg.py
          tests/test_project_currency_pg.py
          tests/test_invoice_zip_pg.py
          tests/test_automation_publish_pg.py
          tests/test_automation_actions_pg.py
          tests/test_attachment_commands_pg.py
          tests/test_issued_attachment_download_pg.py
          tests/test_capture_admission_pg.py
          tests/test_capture_commands_pg.py
          tests/test_document_registry_pg.py
          tests/test_capture_retry_pg.py
          tests/test_capture_authorization_pg.py
          tests/test_capture_download_access_pg.py
          tests/test_n1_supplier_iban_pg.py
          tests/test_transport_lock_concurrency.py
          tests/test_credit_note_lock_concurrency.py
          tests/test_expense_decision_concurrency.py
          tests/test_payment_run_pay_concurrency.py
          tests/test_reimbursement_pay_concurrency.py
          tests/test_usage_counter_concurrency.py
          tests/test_be003_enqueue_savepoint_pg.py
          tests/test_db017_db018_composite_set_null_pg.py
          tests/test_db020_vendor_composite_fk_pg.py
          tests/test_prod009_workspace_export_pg.py
          tests/test_export_redemption_pg.py
          tests/test_verification_consume_pg.py
          tests/test_rls_predicate_shape_pg.py
          tests/test_arch013_scheduler_advisory_lock_pg.py
          tests/test_stir_p1_lease_heartbeat_pg.py
          tests/test_bill_meter_segment_pg.py
      # Read paths must not grow faster than their data (WO-R, audit item R15).
      # Seeds this same migrated database at 1,200 and 4,800 rows per fact table
      # and fails any endpoint whose p95 grew past its declared ceiling. The
      # gate is a RATIO, not a millisecond budget, so a noisy shared runner
      # inflates both halves and leaves the verdict alone — which is the only
      # reason a perf check belongs in CI at all. ~1 minute.
      - name: Read paths must not grow faster than their data (R15)
        env:
          PERF_TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
          PERF_TEST_SCALE: "1200"
        # `-s` so the ratio table reaches this log on SUCCESS as well as on
        # failure: each green run is then a datapoint, and a ratio creeping
        # toward its ceiling over several releases is visible before it trips.
        run: python -m pytest tests/test_perf_shape.py -q -s
      # Concurrency measurement (audit 2026-09-05: "concurrency and write-path
      # performance unmeasured"). Every read scenario and the invoice write
      # path, serial and with 8 requests in flight against this same Postgres,
      # one event loop, one pool — a single worker under load. INFORMATIONAL:
      # the degradation ratio is printed, never gated, on a shared runner; a
      # 4xx/5xx under load is the one hard failure. Each green run is a
      # datapoint (docs/perf/CONCURRENCY-*.md). ~40 s.
      # The per-token limiter (300/min) is OFF here: the harness fires ~340
      # requests from one token inside a minute and datapoint 0 measured its
      # 429s instead of latency. The limit itself is recorded as a datapoint
      # in the doc, not measured around.
      - name: Concurrency measurement (informational)
        env:
          DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
          RATE_LIMIT_ENABLED: "false"
        run: python scripts/perf_harness.py --concurrency 8 --scale 300 --rounds 4

      - name: Node for real PostgreSQL expense browser contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Real expense browser contracts against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: appuser
          PGPASSWORD: apppw
          PGDATABASE: invoiceiq
          VITE_API_PROXY: http://127.0.0.1:8000
        run: |
          python -m scripts.r010_browser_server > ../r010-api.log 2>&1 &
          r010_api_pid=$!
          trap 'kill "$r010_api_pid" 2>/dev/null || true; wait "$r010_api_pid" || true; grep "^R010_RESOURCE" ../r010-api.log || true' EXIT
          PW_CHROMIUM_PATH="$(command -v google-chrome)"
          export PW_CHROMIUM_PATH
          test -x "$PW_CHROMIUM_PATH"
          "$PW_CHROMIUM_PATH" --version
          python --version
          lscpu
          free -m
          cd ../frontend
          npm run test:expenses-live
      - name: Expense browser and resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r010-live-expense-evidence
          path: |
            r010-api.log
            frontend/test-results/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Use the same source-pinned security rebuild as the audited image rather
      # than npm's native compiler with its older embedded Go runtime.
      - name: Install verified TypeScript security rebuild for host CI
        run: python3 ../scripts/install_ci_typescript.py
      - run: npm run build   # tsc --noEmit + vite build (typecheck + bundle)
      # Exercise the actual Vite upload proxy against a real HTTP upstream.
      - run: npm run test:proxy
      # Structural e2e-suite checks (scripts/check-e2e.mjs): no test whose first
      # observable step asserts absence (one shipped and stayed green with its
      # violation seeded), and no spec file silently missing from test:e2e's
      # hand-kept list (five were).
      - run: node scripts/check-e2e.mjs
      # A11y label gate (scripts/check-labels.mjs): every <label> in the SPA
      # must carry htmlFor or wrap its control — the sign-in fields shipped
      # with visual-only labels no screen reader could associate.
      - run: node scripts/check-labels.mjs
      # The inverse a11y gate (scripts/check-controls.mjs, FE-011): every
      # control is labelled by something — aria-label, a htmlFor'd id, or a
      # wrapping label/FormField. A placeholder is not a label.
      - run: node scripts/check-controls.mjs
      # Pending guard (scripts/check-pending.mjs, FE-013): a button that fires
      # a mutation is disabled while it is pending — no double submit.
      - run: node scripts/check-pending.mjs
      # One locale (scripts/check-locale.mjs, FE-018): no page names a locale
      # or calls toLocale*() itself; src/lib/format.ts owns it.
      - run: node scripts/check-locale.mjs
      # Query error-state ratchet (scripts/check-query-errors.mjs): a page that
      # reads with useQuery must be able to say it failed — 23 pages rendered a
      # 4xx or a network error as "no data". The list of pages still without
      # one can only shrink; a new offender fails the build.
      - run: node scripts/check-query-errors.mjs
      # First-load budget gate (scripts/check-bundle.mjs): the chart stack
      # stays off first paint and the entry payload stays under budget — the
      # critical path doubled once under Vite 8 without any test noticing.
      - run: node scripts/check-bundle.mjs

  # Design-system end-to-end smoke tests (Playwright) over the /design showcase.
  # Runs in the version-matched Playwright container, so Chromium is preinstalled
  # (no download) and the config falls back to the bundled browser. Deterministic:
  # the showcase is fixtures-only, and selectors are role/name-based.
  #
  # WO-Y: the visual-regression snapshots used to sit outside CI, described as a
  # LOCAL gate because "pixel baselines are environment-specific". They are — but
  # this job already pins the environment (a version-matched container), which is
  # the only thing that made them local in the first place. Baselines are
  # regenerated HERE via the `refresh_vr_baselines` dispatch input, so the
  # environment that produces them is the environment that checks them.
  # NOTE: the image tag and @playwright/test are a MATCHED PAIR — the image ships
  # exactly the browser build the library expects. Bump both or neither; the
  # guard step below fails loudly rather than letting a skew read as a test
  # failure (a dependency bump split this pair once already).
  frontend-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npm ci
      - name: Playwright library and container image must agree
        run: |
          lib="$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          img="$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' \
                 "$GITHUB_WORKSPACE/.github/workflows/ci.yml" \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$lib" != "$img" ]; then
            echo "::error::Playwright library $lib but container image v$img."
            echo "These are a matched pair: the image ships the browser build the"
            echo "library expects, so a skew fails every spec for a reason that"
            echo "looks nothing like the real cause. Bump the image tag in"
            echo ".github/workflows/ci.yml and @playwright/test together."
            exit 1
          fi
          echo "Playwright $lib matches the container image."
      - run: npm run test:e2e
      # WO-Y — the visual-regression snapshots, now a REAL gate rather than a
      # local habit. They check the same pinned environment that produced them
      # (see `vr-baselines` below), and the budget is an absolute pixel count
      # measured against a seeded regression rather than a ratio that scaled the
      # allowance with page height. On failure the actual/diff images are the
      # only way to tell a real change from noise, so they are kept.
      - run: npm run test:vr
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vr-diff-chromium-linux
          path: frontend/test-results/
          if-no-files-found: ignore

  # WO-Y — regenerate the visual-regression baselines in the SAME container that
  # checks them. Dispatch-only and off by default.
  #
  # It publishes to the BRANCH IT WAS DISPATCHED FROM, and refuses to run on the
  # default branch. That refusal is the whole safety property: baselines are a
  # gate's reference, so a job that could rewrite them on `main` would let anyone
  # bless a regression by re-running a workflow. On a working branch the diff is
  # a normal commit — reviewable, revertable, and merged deliberately.
  #
  # The PNGs are also uploaded as an artifact, because a branch diff of binary
  # files tells you nothing: looking at the images is how you decide whether a
  # change is the regression you were chasing or the fix you intended.
  vr-baselines:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.refresh_vr_baselines == 'true'
      && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    # The one job that writes to the repository: it commits the refreshed
    # baselines to the DISPATCHING branch (the `if:` above refuses main), so it
    # re-grants `contents: write` for itself and keeps the token in the checkout.
    # `tests/test_supply_chain_gates.py` allows exactly this job, by name.
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true  # this job pushes the baselines (see above)
          ref: ${{ github.ref_name }}
      - run: npm ci
      - name: Playwright library and container image must agree
        run: |
          lib="$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          img="$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' \
                 "$GITHUB_WORKSPACE/.github/workflows/ci.yml" \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$lib" != "$img" ]; then
            echo "::error::Playwright library $lib but container image v$img."
            echo "Baselines produced against a mismatched browser would be worse"
            echo "than none: every later run would fail for a reason that looks"
            echo "nothing like the real cause."
            exit 1
          fi
          echo "Playwright $lib matches the container image."
      - run: npm run test:vr:update
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vr-baselines-chromium-linux
          path: frontend/e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
      - name: Publish the refreshed baselines to this branch
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines already match this container — nothing to publish."
            exit 0
          fi
          git commit -m "vr: refresh visual baselines in the CI container (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Load every application/service build stage and runtime for the image gate.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned image inventory parser
        run: python -m pip install pyyaml==6.0.3
      - name: Seed synthetic runtime exclusion probe
        run: |
          mkdir -p backend/var
          echo synthetic-build-exclusion > backend/var/ci-runtime-exclusion-probe
      - name: Build backend image
        id: backend_runtime
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: false
          load: true
          tags: bidit-ci-backend:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify backend runtime exclusion and shared storage volumes
        if: ${{ !cancelled() && steps.backend_runtime.conclusion == 'success' }}
        run: python3 scripts/check_storage_volume.py bidit-ci-backend:review
      - name: Load backend build stage for auditing
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: build
          push: false
          load: true
          tags: bidit-ci-backend-build:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          load: true
          tags: bidit-ci-frontend:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load frontend build stage for auditing
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          target: build
          push: false
          load: true
          tags: bidit-ci-frontend-build:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load TypeScript compiler build stage for auditing
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          target: typescript-compiler
          push: false
          load: true
          tags: bidit-ci-frontend-compiler-build:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build PostgreSQL security rebuild
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/postgres
          push: false
          load: true
          tags: bidit-ci-postgres:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load PostgreSQL build stage for auditing
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/postgres
          target: build
          push: false
          load: true
          tags: bidit-ci-postgres-build:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build PgBouncer security rebuild
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/pgbouncer
          push: false
          load: true
          tags: bidit-ci-pgbouncer:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load PgBouncer build stage for auditing
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/pgbouncer
          target: build
          push: false
          load: true
          tags: bidit-ci-pgbouncer-build:review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build, final and deployment service image audit
        id: image_audit
        if: ${{ !cancelled() }}
        run: python scripts/image_audit.py
      - name: Native S3 initialization, persistence and refusal checks
        if: ${{ !cancelled() && steps.image_audit.conclusion == 'success' }}
        run: python scripts/check_s3_storage.py bidit-ci-backend:review > image-security/storage-smoke.json
      - name: Image security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-image-security
          path: image-security/
          retention-days: 7

  # CI-gated production deploy. Runs ONLY after every check above passes, ONLY on a
  # push to the production branch, and ONLY once opted in via the repo variable
  # DEPLOY_ENABLED=true — until that variable is set the job is SKIPPED, so CI stays
  # green before the deploy secrets exist. It SSHes to the single VPS and runs its
  # deploy script; the deploy key is restricted to that one command on the server
  # side (forced command in authorized_keys), so a leaked key can't run arbitrary
  # root commands. Setup: docs/DEPLOY-HOSTINGER.md#automated-ci-gated-deploy.
  deploy:
    runs-on: ubuntu-latest
    needs: [pii-scan, lint, backend, postgres, frontend, frontend-e2e, docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # OPS-013 (audit 2026-09-05): the job runs in the `production` GitHub
    # Environment, so the deploy history is visible under Deployments and the
    # owner can attach protection rules (required reviewers, a wait timer,
    # branch restriction) in Settings → Environments without a workflow change.
    # GitHub creates the environment on first use; the rules are the owner's.
    environment:
      name: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # -4 everywhere: GitHub-hosted runners have NO outbound IPv6, so a
          # host that resolves AAAA-first fails with "Network is unreachable"
          # (run #477). ConnectTimeout keeps a dead host from eating minutes.
          ssh-keyscan -4 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Deploying to $DEPLOY_HOST…"
          ssh -4 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
      # OPS-002 (audit 2026-09-05): `docker compose up -d --build` exits 0 once
      # containers are CREATED, not once they are healthy. A migration that
      # fails on boot crash-loops the backend while the old frontend keeps
      # serving 502s — and this job was already green. The job's verdict must
      # be the application's, not the SSH channel's: poll the public readiness
      # probe for up to five minutes. Set the repo variable DEPLOY_HEALTH_URL
      # (e.g. https://app.example.com/health/ready); until it exists the step
      # warns instead of failing, so nothing regresses before the owner sets it.
      - name: Assert the deployed site is up
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::DEPLOY_HEALTH_URL is not set — the deploy is NOT health-gated. Set it to the public /health/ready URL."
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "ready after ~$((i * 10))s: $HEALTH_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL did not answer 200 within 300s — the deploy landed but the site is NOT up. See docs/DEPLOY-RUNBOOK-2026-08-15.md §6 (rollback)."
          exit 1
