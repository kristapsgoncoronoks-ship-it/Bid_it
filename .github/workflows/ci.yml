name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static gate — runs first, no services, fails in seconds on a style/type
  # regression before the slower test/docker jobs spend a runner.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy (foundation layer — app/core)
        run: mypy app/core

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Migrations are consistent (single head, apply cleanly, no drift)
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic check
      - run: python -m pytest -q

  # Postgres-specific gate: migrations + RLS can only be verified against a real
  # Postgres (the main suite runs on SQLite). Catches Postgres-only migration
  # bugs and proves row-level security blocks cross-tenant at the DB layer.
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create a NON-superuser app role + database (RLS must apply to it)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE appuser LOGIN PASSWORD 'apppw' NOSUPERUSER;"
          psql -h localhost -U postgres -c "CREATE DATABASE invoiceiq OWNER appuser;"
      - name: Migrations apply cleanly on Postgres (catches Postgres-only bugs)
        env:
          DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: alembic upgrade head
      - name: Row-level-security enforcement tests
        env:
          RLS_TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: python -m pytest tests/test_rls.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit + vite build (typecheck + bundle)

  # Design-system end-to-end smoke tests (Playwright) over the /design showcase.
  # Runs in the version-matched Playwright container, so Chromium is preinstalled
  # (no download) and the config falls back to the bundled browser. Deterministic:
  # the showcase is fixtures-only, and selectors are role/name-based. Visual-
  # regression snapshots (npm run test:vr) are a LOCAL gate — pixel baselines are
  # environment-specific, so they aren't run here.
  frontend-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run test:e2e

  # Prove both images build (catches Dockerfile / .dockerignore regressions).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CI-gated production deploy. Runs ONLY after every check above passes, ONLY on a
  # push to the production branch, and ONLY once opted in via the repo variable
  # DEPLOY_ENABLED=true — until that variable is set the job is SKIPPED, so CI stays
  # green before the deploy secrets exist. It SSHes to the single VPS and runs its
  # deploy script; the deploy key is restricted to that one command on the server
  # side (forced command in authorized_keys), so a leaked key can't run arbitrary
  # root commands. Setup: docs/DEPLOY-HOSTINGER.md#automated-ci-gated-deploy.
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, backend, postgres, frontend, frontend-e2e, docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/claude/invoice-data-analytics-qmjy7q' &&
      vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Deploying to $DEPLOY_HOST…"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
