name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Migrations are consistent (single head, apply cleanly, no drift)
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic check
      - run: python -m pytest -q

  # Postgres-specific gate: migrations + RLS can only be verified against a real
  # Postgres (the main suite runs on SQLite). Catches Postgres-only migration
  # bugs and proves row-level security blocks cross-tenant at the DB layer.
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create a NON-superuser app role + database (RLS must apply to it)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE appuser LOGIN PASSWORD 'apppw' NOSUPERUSER;"
          psql -h localhost -U postgres -c "CREATE DATABASE invoiceiq OWNER appuser;"
      - name: Migrations apply cleanly on Postgres (catches Postgres-only bugs)
        env:
          DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: alembic upgrade head
      - name: Row-level-security enforcement tests
        env:
          RLS_TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: python -m pytest tests/test_rls.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit + vite build (typecheck + bundle)

  # Prove both images build (catches Dockerfile / .dockerignore regressions).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
