name: CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest defusedxml

      # Hygiene FIRST — a leaked client doc / secret should fail before we spend CI minutes.
      - name: Repo hygiene (no secrets, no un-allow-listed data files)
        run: python tools/check_repo_hygiene.py

      - name: Byte-compile the whole tree
        run: python -m compileall -q .

      # FFS_STRICT_ENDPOINTS=1 turns the route-coverage self-check into a hard failure,
      # so an unclassified (default-allow) route fails CI instead of silently shipping.
      - name: Tests (strict endpoint coverage)
        env:
          FFS_STRICT_ENDPOINTS: "1"
        run: python -m pytest tests/ -q

      # Reset the demo state before the consolidate smoke (mirrors the local cleanup):
      #  - the test suite churns the tracked demo DBs (suppliers.db carries per-supplier
      #    config the close reads), so restore them to the pristine checkout;
      #  - a networked FX test caches live PLN rates in the gitignored ecb_rates.db, which
      #    would make BP's consolidate conversion use the live rate instead of the config
      #    4.27 (supplier_specs._pln_rate falls back to config only when no rate is cached)
      #    — remove it so the smoke validates against the deterministic config rate.
      - name: Reset demo state before consolidate
        run: |
          git checkout -- customers.db suppliers.db fuel_history.db
          rm -f ecb_rates.db *.db-wal *.db-shm

      - name: Consolidate smoke (all suppliers must pass)
        run: python consolidate.py
