name: CI

on:
  # Push CI runs only on main (post-merge) + manual dispatch; branch work is
  # covered by the pull_request run, so a PR'd branch is no longer built twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_vr_baselines:
        description: >-
          Regenerate the visual-regression baselines inside the CI container and
          upload them as an artifact. NEVER commits: a workflow that rewrote its
          own baselines would bless whatever regression prompted the refresh.
          Download, look at the images, commit them deliberately.
        type: boolean
        default: false

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fleet Fuel PII quarantine gate (WO-6, risk L-3) — REQUIRED CHECK. Fast and
  # dependency-free (stdlib only, no pip install): scans the working tree for
  # deny-listed Fleet Fuel identifiers (salted-hash compare — the salt is the
  # PII_SCAN_SALT secret, never committed) plus structural EU-VAT-id / MOD-97
  # IBAN patterns. Fails closed on a missing deny-list; a false positive is
  # resolved by an allow-list entry with a named verifier — NEVER by disabling
  # this job. Nightly full-history pass: .github/workflows/pii-history.yml.
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: PII scan (working tree)
        env:
          PII_SCAN_SALT: ${{ secrets.PII_SCAN_SALT }}
        run: python scripts/pii_scan.py --tree

  # Fast static gate — runs first, no services, fails in seconds on a style/type
  # regression before the slower test/docker jobs spend a runner.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy (whole app — type-clean, enforced)
        run: mypy app

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Migrations are consistent (single head, apply cleanly, no drift)
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic check
      - run: python -m pytest -q

  # Postgres-specific gate: migrations + RLS can only be verified against a real
  # Postgres (the main suite runs on SQLite). Catches Postgres-only migration
  # bugs and proves row-level security blocks cross-tenant at the DB layer.
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create a NON-superuser app role + database (RLS must apply to it)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE appuser LOGIN PASSWORD 'apppw' NOSUPERUSER;"
          psql -h localhost -U postgres -c "CREATE DATABASE invoiceiq OWNER appuser;"
      - name: Migrations apply cleanly on Postgres (catches Postgres-only bugs)
        env:
          DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: alembic upgrade head
      # QA-001 (audit 2026-09-05): EVERY file that self-selects on
      # RLS_TEST_DATABASE_URL must be named here — eight of these tests (the
      # double-payment, double-credit and pooled-connection RLS guards) existed
      # for weeks and ran in NO job because this list was kept by hand.
      # tests/test_qa001_pg_tests_run_in_ci.py now fails the build when a
      # pg-only file is missing from this step.
      - name: Postgres-only tests (RLS enforcement + every concurrency guard)
        env:
          RLS_TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
        run: >-
          python -m pytest -q
          tests/test_rls.py
          tests/test_rls_connection_reuse.py
          tests/test_numbering_concurrency.py
          tests/test_transport_lock_concurrency.py
          tests/test_credit_note_lock_concurrency.py
          tests/test_expense_decision_concurrency.py
          tests/test_payment_run_pay_concurrency.py
          tests/test_reimbursement_pay_concurrency.py
          tests/test_usage_counter_concurrency.py
          tests/test_be003_enqueue_savepoint_pg.py
      # Read paths must not grow faster than their data (WO-R, audit item R15).
      # Seeds this same migrated database at 1,200 and 4,800 rows per fact table
      # and fails any endpoint whose p95 grew past its declared ceiling. The
      # gate is a RATIO, not a millisecond budget, so a noisy shared runner
      # inflates both halves and leaves the verdict alone — which is the only
      # reason a perf check belongs in CI at all. ~1 minute.
      - name: Read paths must not grow faster than their data (R15)
        env:
          PERF_TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppw@localhost:5432/invoiceiq
          PERF_TEST_SCALE: "1200"
        # `-s` so the ratio table reaches this log on SUCCESS as well as on
        # failure: each green run is then a datapoint, and a ratio creeping
        # toward its ceiling over several releases is visible before it trips.
        run: python -m pytest tests/test_perf_shape.py -q -s

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit + vite build (typecheck + bundle)
      # Structural e2e-suite checks (scripts/check-e2e.mjs): no test whose first
      # observable step asserts absence (one shipped and stayed green with its
      # violation seeded), and no spec file silently missing from test:e2e's
      # hand-kept list (five were).
      - run: node scripts/check-e2e.mjs
      # A11y label gate (scripts/check-labels.mjs): every <label> in the SPA
      # must carry htmlFor or wrap its control — the sign-in fields shipped
      # with visual-only labels no screen reader could associate.
      - run: node scripts/check-labels.mjs
      # First-load budget gate (scripts/check-bundle.mjs): the chart stack
      # stays off first paint and the entry payload stays under budget — the
      # critical path doubled once under Vite 8 without any test noticing.
      - run: node scripts/check-bundle.mjs

  # Design-system end-to-end smoke tests (Playwright) over the /design showcase.
  # Runs in the version-matched Playwright container, so Chromium is preinstalled
  # (no download) and the config falls back to the bundled browser. Deterministic:
  # the showcase is fixtures-only, and selectors are role/name-based.
  #
  # WO-Y: the visual-regression snapshots used to sit outside CI, described as a
  # LOCAL gate because "pixel baselines are environment-specific". They are — but
  # this job already pins the environment (a version-matched container), which is
  # the only thing that made them local in the first place. Baselines are
  # regenerated HERE via the `refresh_vr_baselines` dispatch input, so the
  # environment that produces them is the environment that checks them.
  # NOTE: the image tag and @playwright/test are a MATCHED PAIR — the image ships
  # exactly the browser build the library expects. Bump both or neither; the
  # guard step below fails loudly rather than letting a skew read as a test
  # failure (a dependency bump split this pair once already).
  frontend-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Playwright library and container image must agree
        run: |
          lib="$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          img="$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' \
                 "$GITHUB_WORKSPACE/.github/workflows/ci.yml" \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$lib" != "$img" ]; then
            echo "::error::Playwright library $lib but container image v$img."
            echo "These are a matched pair: the image ships the browser build the"
            echo "library expects, so a skew fails every spec for a reason that"
            echo "looks nothing like the real cause. Bump the image tag in"
            echo ".github/workflows/ci.yml and @playwright/test together."
            exit 1
          fi
          echo "Playwright $lib matches the container image."
      - run: npm run test:e2e
      # WO-Y — the visual-regression snapshots, now a REAL gate rather than a
      # local habit. They check the same pinned environment that produced them
      # (see `vr-baselines` below), and the budget is an absolute pixel count
      # measured against a seeded regression rather than a ratio that scaled the
      # allowance with page height. On failure the actual/diff images are the
      # only way to tell a real change from noise, so they are kept.
      - run: npm run test:vr
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vr-diff-chromium-linux
          path: frontend/test-results/
          if-no-files-found: ignore

  # WO-Y — regenerate the visual-regression baselines in the SAME container that
  # checks them. Dispatch-only and off by default.
  #
  # It publishes to the BRANCH IT WAS DISPATCHED FROM, and refuses to run on the
  # default branch. That refusal is the whole safety property: baselines are a
  # gate's reference, so a job that could rewrite them on `main` would let anyone
  # bless a regression by re-running a workflow. On a working branch the diff is
  # a normal commit — reviewable, revertable, and merged deliberately.
  #
  # The PNGs are also uploaded as an artifact, because a branch diff of binary
  # files tells you nothing: looking at the images is how you decide whether a
  # change is the regression you were chasing or the fix you intended.
  vr-baselines:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.refresh_vr_baselines == 'true'
      && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - run: npm ci
      - name: Playwright library and container image must agree
        run: |
          lib="$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          img="$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+' \
                 "$GITHUB_WORKSPACE/.github/workflows/ci.yml" \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$lib" != "$img" ]; then
            echo "::error::Playwright library $lib but container image v$img."
            echo "Baselines produced against a mismatched browser would be worse"
            echo "than none: every later run would fail for a reason that looks"
            echo "nothing like the real cause."
            exit 1
          fi
          echo "Playwright $lib matches the container image."
      - run: npm run test:vr:update
      - uses: actions/upload-artifact@v4
        with:
          name: vr-baselines-chromium-linux
          path: frontend/e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
      - name: Publish the refreshed baselines to this branch
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines already match this container — nothing to publish."
            exit 0
          fi
          git commit -m "vr: refresh visual baselines in the CI container (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Prove both images build (catches Dockerfile / .dockerignore regressions).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CI-gated production deploy. Runs ONLY after every check above passes, ONLY on a
  # push to the production branch, and ONLY once opted in via the repo variable
  # DEPLOY_ENABLED=true — until that variable is set the job is SKIPPED, so CI stays
  # green before the deploy secrets exist. It SSHes to the single VPS and runs its
  # deploy script; the deploy key is restricted to that one command on the server
  # side (forced command in authorized_keys), so a leaked key can't run arbitrary
  # root commands. Setup: docs/DEPLOY-HOSTINGER.md#automated-ci-gated-deploy.
  deploy:
    runs-on: ubuntu-latest
    needs: [pii-scan, lint, backend, postgres, frontend, frontend-e2e, docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # -4 everywhere: GitHub-hosted runners have NO outbound IPv6, so a
          # host that resolves AAAA-first fails with "Network is unreachable"
          # (run #477). ConnectTimeout keeps a dead host from eating minutes.
          ssh-keyscan -4 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Deploying to $DEPLOY_HOST…"
          ssh -4 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" deploy
