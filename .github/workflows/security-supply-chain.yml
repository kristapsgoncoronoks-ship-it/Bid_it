# Supply-chain security (SEC-SC-001 / SEC-SC-002 / SEC-SC-003, Personal-Security-
# Checklist cycle, reference integration R3 — 2026-09-07).
#
# Four small jobs, deliberately separate from ci.yml so the security tooling
# holds no write capability and cannot be widened by a change to the build:
#   workflow-review     actionlint + zizmor over .github/, plus the action-pin
#                       and control-register gates (also run in ci.yml's lint job)
#   secret-scan         TruffleHog over the PR diff, VERIFIED secrets only — a
#                       generic credential scanner, distinct from the PII gate
#   dependency-review   audits complete Python + npm graphs, including dev and
#                       transitive dependencies, without a hosted license dependency
#   security-controls   the register and its generated view must agree
#
# Every action below is pinned to a commit SHA verified against its upstream
# tag with `git ls-remote` (see docs/plan/REFERENCE-INTEGRATION-PLAN.md).
name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Security tooling has no write capability by default.
permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-review:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every external action is pinned to a full commit SHA
        run: python3 scripts/check_github_action_pins.py

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.0
          inputs: .github/
          advanced-security: false
          annotations: true

  secret-scan:
    name: Generic credential scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan PR diff with TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The private repository's hosted dependency-review service is unsupported.
      # Keep this required job and fail closed using full-graph ecosystem audits.
      - name: Python audit runtime
        id: python_runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Audit all Python runtime and development dependencies
        id: python_audit
        working-directory: backend
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt --format json --output ../dependency-head-python.json

      - name: Record resolved base/head changes
        id: dependency_delta
        # pip-audit writes its resolved graph even when advisories make it fail.
        if: ${{ !cancelled() && hashFiles('dependency-head-python.json') != '' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/dependency_delta.py --base "$BASE_SHA" --head-audit dependency-head-python.json --output dependency-delta.json

      - name: Node audit runtime
        id: node_runtime
        # An unavailable/vulnerable Python graph must not hide the npm verdict.
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate and audit the complete npm lock graph
        id: npm_audit
        if: ${{ !cancelled() && steps.node_runtime.outcome == 'success' }}
        working-directory: frontend
        run: |
          npm ci --include=dev --ignore-scripts
          npm audit --include=dev --audit-level=moderate --json > ../dependency-head-npm.json

      - name: Record audit outcomes and unavailable reports
        if: ${{ !cancelled() }}
        env:
          PYTHON_RUNTIME_OUTCOME: ${{ steps.python_runtime.outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ steps.python_audit.outcome }}
          DEPENDENCY_DELTA_OUTCOME: ${{ steps.dependency_delta.outcome }}
          NODE_RUNTIME_OUTCOME: ${{ steps.node_runtime.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = {
              name.lower(): os.environ[name + '_OUTCOME']
              for name in ('PYTHON_RUNTIME', 'PYTHON_AUDIT', 'DEPENDENCY_DELTA', 'NODE_RUNTIME', 'NPM_AUDIT')
          }
          unavailable = []
          for name in ('dependency-head-python.json', 'dependency-head-npm.json', 'dependency-delta.json'):
              try:
                  report = json.loads(Path(name).read_text())
                  if not isinstance(report, dict) or not report:
                      unavailable.append(name)
              except (OSError, ValueError):
                  unavailable.append(name)
          passed = all(outcome == 'success' for outcome in outcomes.values()) and not unavailable
          status = {'status': 'passed' if passed else 'blocked', 'step_outcomes': outcomes,
                    'missing_or_invalid_reports': sorted(unavailable)}
          Path('dependency-check-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print('Dependency review: ' + status['status'] + '; missing reports are not clean audits.')
          raise SystemExit(0 if passed else 1)
          PY

      - name: Dependency review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review-evidence
          path: |
            dependency-head-python.json
            dependency-head-npm.json
            dependency-delta.json
            dependency-check-status.json
          if-no-files-found: error
          retention-days: 7

  security-controls:
    name: Security control register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate control evidence/status and the generated view
        run: python3 scripts/security_control_gate.py --check
