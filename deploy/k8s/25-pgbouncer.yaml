# PgBouncer — connection pooler for the scale-out path (≈1,000+ tenants).
#
# Why: total Postgres connections = web-workers × web-pods × (pool_size +
# max_overflow) + worker-tier connections. At 8 web pods × 2 workers × 20 that is
# 320 server connections before the worker tier — past a typical Postgres
# max_connections. PgBouncer in TRANSACTION mode multiplexes many client
# connections onto a small server pool (here 25), so the app scales pods without
# exhausting Postgres.
#
# REQUIRED app setting: set DB_PGBOUNCER=true (backend disables asyncpg prepared
# statements, which are incompatible with transaction pooling) and point
# DATABASE_URL at this service:
#   postgresql+asyncpg://invoiceiq:PASS@pgbouncer:6432/invoiceiq
#
# Not needed at ~100 tenants — a direct DB connection fits under max_connections.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: invoiceiq
data:
  # edoburu/pgbouncer reads these env-style keys to render pgbouncer.ini.
  POOL_MODE: "transaction"          # multiplex per-transaction (max reuse)
  MAX_CLIENT_CONN: "1000"           # clients the pooler will accept
  DEFAULT_POOL_SIZE: "25"           # server connections per (user,db) to Postgres
  MIN_POOL_SIZE: "5"
  RESERVE_POOL_SIZE: "5"
  SERVER_IDLE_TIMEOUT: "600"
  AUTH_TYPE: "scram-sha-256"
  # The vendor defaults to 5432; every app URL/service/probe below uses 6432.
  LISTEN_PORT: "6432"
  # DB target — host/port/name of the real Postgres. Keep the DB_USER/DB_PASSWORD
  # in the existing secret; wire them below via envFrom/secretKeyRef.
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "invoiceiq"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: invoiceiq
  labels: { app: invoiceiq, component: pgbouncer }
spec:
  replicas: 2                        # HA; each pools independently to Postgres
  selector:
    matchLabels: { app: invoiceiq, component: pgbouncer }
  template:
    metadata:
      labels: { app: invoiceiq, component: pgbouncer }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                 # the image's pgbouncer user
        runAsGroup: 70
        fsGroup: 70                   # permit config generation on the emptyDir
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pgbouncer
          # Same-vendor runtime with checksum-verified upstream 1.26.1 binary.
          # Published by the release workflow; use the same reviewed app release.
          image: ghcr.io/OWNER/REPO/pgbouncer:VERSION
          ports:
            - { name: pgbouncer, containerPort: 6432 }
          envFrom:
            - configMapRef: { name: pgbouncer-config }
          env:
            # Reuse the DB credentials already in the app secret.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: invoiceiq-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: invoiceiq-secrets, key: DB_PASSWORD } }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # The entrypoint renders pgbouncer.ini + plaintext SCRAM userlist.
            # A memory volume allows this with a read-only root filesystem and
            # discards the generated credentials when the pod is removed.
            - { name: pgbouncer-config, mountPath: /etc/pgbouncer }
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "6432"]
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 15
          readinessProbe:
            # A listening pooler can still have no working backend connection.
            # Check authenticated SQL so a DB outage removes this pod from use.
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  PGPASSWORD="$DB_PASSWORD" PGCONNECT_TIMEOUT=3
                  exec psql -X --no-password --host=127.0.0.1 --port=6432
                  --username="$DB_USER" --dbname="$DB_NAME"
                  --tuples-only --no-align --command='SELECT 1'
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: pgbouncer-config
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: invoiceiq
spec:
  selector: { app: invoiceiq, component: pgbouncer }
  ports:
    - { name: pgbouncer, port: 6432, targetPort: 6432 }
